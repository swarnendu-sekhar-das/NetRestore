version: "3.9"

services:
  netrestore:
    build: .
    image: ${DOCKER_USER:-local}/netrestore:${TAG:-latest}
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      # Keep the local ChromaDB files between container restarts.
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # These limits work with standalone Docker Compose.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"

# The bind mount keeps ChromaDB files in the host project directory.
