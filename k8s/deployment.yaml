apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb-statefulset
  labels:
    app: chromadb
spec:
  serviceName: "chromadb-service"
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
      - name: chromadb
        image: chromadb/chroma:latest
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: chroma-data
          mountPath: /chroma/chroma
  volumeClaimTemplates:
  - metadata:
      name: chroma-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chromadb-service
spec:
  selector:
    app: chromadb
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netrestore-backend
  labels:
    app: netrestore-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netrestore-backend
  template:
    metadata:
      labels:
        app: netrestore-backend
    spec:
      containers:
      - name: netrestore-backend
        image: swarnendusekhardas/netrestore-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: netrestore-secrets
              key: groq_api_key
        - name: CHROMADB_HOST
          value: "chromadb-service"
        volumeMounts:
        - name: shared-data
          mountPath: /app/shared_data
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: shared-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: netrestore-backend-service
spec:
  selector:
    app: netrestore-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netrestore-frontend
  labels:
    app: netrestore-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netrestore-frontend
  template:
    metadata:
      labels:
        app: netrestore-frontend
    spec:
      containers:
      - name: netrestore-frontend
        image: swarnendusekhardas/netrestore-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
        env:
        - name: BACKEND_URL
          value: "http://netrestore-backend-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: netrestore-frontend-service
spec:
  selector:
    app: netrestore-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
